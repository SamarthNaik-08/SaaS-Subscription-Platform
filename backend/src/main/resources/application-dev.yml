spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas_platform}
    username: ${DB_USERNAME:saas_user}
    password: ${DB_PASSWORD:saas_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

logging:
  level:
    com.saasplatform: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
