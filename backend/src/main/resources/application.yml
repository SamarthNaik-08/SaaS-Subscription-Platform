server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: saas-platform-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  jwt:
    # 256-bit base64 encoded secret for HMAC-SHA256 (default development key)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    image:
      provider: ${AI_IMAGE_PROVIDER:auto}
    multimodal:
      provider: ${AI_MULTIMODAL_PROVIDER:auto}
      max-file-size-bytes: ${AI_MAX_FILE_SIZE_BYTES:10485760} # 10MB
    web-search:
      enabled: ${AI_WEB_SEARCH_ENABLED:true}
      provider: ${AI_WEB_SEARCH_PROVIDER:auto}
      api-key: ${TAVILY_API_KEY:}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com/search}
      max-results: ${AI_WEB_SEARCH_MAX_RESULTS:5}
      timeout-ms: ${AI_WEB_SEARCH_TIMEOUT_MS:10000}
  payment:
    provider: ${PAYMENT_PROVIDER:SANDBOX}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
      key-secret: ${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_placeholder}
  billing:
    tax-rate-percentage: ${TAX_RATE_PERCENTAGE:18.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
